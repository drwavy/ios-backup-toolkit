[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ios-backup-toolkit"
version = "0.1.0"
description = "Extract and recover data from your own unencrypted local iOS backup"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "Pillow>=9.0",
    "mutagen>=1.45",
]

[project.optional-dependencies]
heic = ["pillow-heif>=0.10"]

[project.scripts]
ibtk = "ibtk.cli:main"

[tool.setuptools]
packages = ["ibtk", "ibtk.commands"]
